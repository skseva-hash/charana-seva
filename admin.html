  <h1 style="margin-top:8px">Organiser login</h1>
  <div class="note">Enter your organiser passcode.</div>
  <input id="pin" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Passcode">
  <button id="go">Log in</button>
  <div class="note" id="err"></div>
</div>

<div id="dash" class="hide">
  <div class="top"><div><h1>Organiser <span class="role" id="role"></span></h1><div class="sub" id="who"></div></div><button class="alt" id="out">Log out</button></div>
  <div class="stats"><div class="stat"><b id="sW">0</b><span>Walking</span></div><div class="stat"><b id="sF">0</b><span>Finished</span></div><div class="stat"><b id="sK">0</b><span>Total km</span></div></div>
  <div class="card"><div id="map"></div>
    <div class="btns"><button class="alt" id="fit">Fit all walkers</button><button class="alt" id="ref">Refresh now</button></div>
    <div class="note" id="upd"></div></div>
  <div class="card"><b>Walkers</b><div id="tbl"></div>
    <div class="btns"><button id="csvB">Download CSV</button><button class="danger main-only" id="clr">Clear all walkers</button></div></div>
  <div class="card main-only" id="adm"><b>Organisers</b>
    <div class="note">You are the main admin. Add organisers so others can see the map and manage walkers. They cannot add organisers or clear all data.</div>
    <div id="alist"></div>
    <input id="an" placeholder="New organiser's name" maxlength="30">
    <button id="add">Add organiser</button>
    <div id="newpass"></div></div>
</div>

<script src="config.js"></script>

<script>
const $=id=>document.getElementById(id);
const API=(window.CHM_DB_URL||'').replace(/\/$/,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pstr=p=>p?Math.floor(p)+':'+String(Math.round((p%1)*60)%60).padStart(2,'0'):'--';
const fmt=ms=>{const s=Math.floor(ms/1e3);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const hex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function kdf(pass,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:200000},k,256))}
const norm=s=>String(s).replace(/[\s-]/g,'').toUpperCase();
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newPass(){const r=crypto.getRandomValues(new Uint8Array(10));const s=[...r].map(x=>AL[x%32]).join('');return s.slice(0,5)+'-'+s.slice(5)}
const get=async p=>{const r=await fetch(API+p+'.json');if(!r.ok)throw 0;return r.json()};
const put=(p,o)=>fetch(API+p+'.json',{method:'PUT',body:JSON.stringify(o)});
const del=p=>fetch(API+p+'.json',{method:'DELETE'});

let S=null,LV={},RS={},AD={},map=null,markers={},fitted=false,timer=null;

/* login */
$('go').onclick=async()=>{
  const p=norm($('pin').value);$('err').textContent='';if(!p)return;
  if(!API||!window.CHM_ADMIN_HASH){$('err').textContent='Organiser login is not set up yet.';return}
  $('go').disabled=true;$('go').textContent='Checking…';
  try{
    if(await kdf(p,window.CHM_ADMIN_SALT)===window.CHM_ADMIN_HASH){S={role:'main',name:'Main admin'}}
    else{const ad=await get('/admins')||{};
      for(const[id,a]of Object.entries(ad)){if(a&&a.salt&&await kdf(p,a.salt)===a.hash){S={role:'second',name:a.name,id};break}}}
    if(S){sessionStorage.setItem('adm',JSON.stringify(S));start()}else $('err').textContent='That passcode is not right.';
  }catch(e){$('err').textContent='Could not connect. Check your internet and try again.'}
  $('go').disabled=false;$('go').textContent='Log in';
};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click()});
$('out').onclick=()=>{sessionStorage.removeItem('adm');location.reload()};
try{const s=JSON.parse(sessionStorage.getItem('adm')||'null');if(s&&s.role){S=s;start()}}catch(e){}

function start(){
  $('gate').classList.add('hide');$('dash').classList.remove('hide');
  $('role').textContent=S.role==='main'?'Main admin':'Organiser';$('who').textContent=S.role==='main'?'Full access':'Signed in as '+S.name;
  document.querySelectorAll('.main-only').forEach(e=>e.classList.toggle('hide',S.role!=='main'));
  initMap();poll();timer=setInterval(poll,5000);temples();
}

/* map */
function initMap(){
  map=L.map('map').setView([-35.2,149.08],11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
}
function temples(){
  [['CHM Moncrieff','5 Hoffmann Street, Moncrieff ACT 2914'],['HTCC Florey','81 Ratcliffe Crescent, Florey ACT 2615']].forEach(([n,a],i)=>setTimeout(async()=>{
    try{const r=await(await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q='+encodeURIComponent(a))).json();
      if(r[0])L.marker([+r[0].lat,+r[0].lon],{icon:L.divIcon({className:'',html:'<div class="tp">🛕</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map).bindPopup('<b>'+esc(n)+'</b><br>'+esc(a))}catch(e){}},i*1500));
}
function fitAll(){const p=Object.values(markers).map(m=>m.getLatLng());if(p.length)map.fitBounds(L.latLngBounds(p).pad(.3),{maxZoom:17})}
$('fit').onclick=fitAll;$('ref').onclick=poll;

/* data */
async function poll(){
  try{
    const[a,b,c]=await Promise.all([get('/live'),get('/results'),get('/admins')]);
    LV=a||{};RS=b||{};AD=c||{};
    if(S.role==='second'&&!AD[S.id]){sessionStorage.removeItem('adm');alert('Your organiser access was removed.');location.reload();return}
    render();$('upd').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){$('upd').textContent='Connection problem. Retrying…'}
}
function people(){
  const now=Date.now(),ids=new Set([...Object.keys(LV),...Object.keys(RS)]);
  return[...ids].map(id=>{const l=LV[id]||null,r=RS[id]||null,name=(l&&l.name)||(r&&r.name);if(!name)return null;
    const fin=(l&&l.st==='finished')||(!l&&!!r),age=l&&l.t?now-l.t:null;
    return{id,name,km:fin&&r?+r.km:(l?+l.km:0),pace:l?l.pace:0,hr:l&&l.hr,steps:l&&l.steps,lat:l&&l.lat,lon:l&&l.lon,fin,stale:!fin&&age!==null&&age>180000,age,ms:r&&r.ms,avg:r&&r.avg,max:r&&r.max}}).filter(Boolean).sort((x,y)=>y.km-x.km);
}
function render(){
  const R=people();
  $('sW').textContent=R.filter(x=>!x.fin&&!x.stale).length;$('sF').textContent=R.filter(x=>x.fin).length;$('sK').textContent=R.reduce((s,x)=>s+(+x.km||0),0).toFixed(1);
  $('tbl').innerHTML=R.length?R.map(x=>`<div class="row"><div><div class="nm">${esc(x.name)}<span class="chip ${x.fin?'f':x.stale?'s':'w'}">${x.fin?'Finished':x.stale?'No signal':'Walking'}</span></div>
    <div class="meta">${pstr(x.pace)} min/km · ${x.hr?'❤ '+esc(x.hr):'no HR'}${x.steps?' · '+esc(x.steps)+' steps':''}${x.age!=null&&!x.fin?' · '+Math.round(x.age/1000)+'s ago':''}</div></div>
    <div class="km">${(+x.km).toFixed(2)}<small>km</small></div>
    <div class="act">${x.lat&&!x.fin?`<button data-z="${esc(x.id)}" title="Show on map">📍</button>`:''}<button data-d="${esc(x.id)}" title="Remove">🗑</button></div></div>`).join(''):'<div class="note">No walkers yet.</div>';
  const seen=new Set();
  R.filter(x=>x.lat&&!x.fin).forEach(x=>{seen.add(x.id);const ll=[x.lat,x.lon],col=x.stale?'#d98a00':'#9c1f1f';let m=markers[x.id];
    if(!m){m=markers[x.id]=L.circleMarker(ll,{radius:9,weight:3,color:'#fff',fillOpacity:1,fillColor:col}).addTo(map);m.bindTooltip('',{permanent:true,direction:'right',offset:[8,0],className:'ptip'});m.bindPopup('')}
    m.setLatLng(ll);m.setStyle({fillColor:col});m.setTooltipContent(esc(String(x.name).split(' ')[0]));
    m.setPopupContent(`<b>${esc(x.name)}</b><br>${(+x.km).toFixed(2)} km · ${pstr(x.pace)} min/km<br>${x.hr?'❤ '+esc(x.hr)+' bpm':'no heart rate'}<br><a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(x.lat+','+x.lon)}">Open in Google Maps</a>`)});
  Object.keys(markers).forEach(id=>{if(!seen.has(id)){map.removeLayer(markers[id]);delete markers[id]}});
  if(!fitted&&seen.size){fitAll();fitted=true}
  if(S.role==='main')renderAdmins();
}
$('tbl').onclick=async e=>{
  const z=e.target.closest('[data-z]'),d=e.target.closest('[data-d]');
  if(z&&markers[z.dataset.z]){const m=markers[z.dataset.z];map.setView(m.getLatLng(),17);m.openPopup();$('map').scrollIntoView({behavior:'smooth',block:'center'})}
  if(d&&confirm('Remove this walker from the leaderboard and results?')){const id=d.dataset.d;await del('/live/'+encodeURIComponent(id));await del('/results/'+encodeURIComponent(id));poll()}
};
$('clr').onclick=async()=>{
  if(S.role!=='main')return;
  if(prompt('This deletes ALL walkers and results (organisers are kept).\nType CLEAR to confirm.')==='CLEAR'){await del('/live');await del('/results');poll()}
};
$('csvB').onclick=()=>{
  const q=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
  const rows=[['Name','Status','Km','Time','Pace min/km','Avg BPM','Max BPM','Steps']].concat(people().map(x=>[x.name,x.fin?'Finished':x.stale?'No signal':'Walking',(+x.km).toFixed(2),x.ms?fmt(x.ms):'',pstr(x.pace),x.avg??x.hr??'',x.max??'',x.steps??'']));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));
  a.download='charana-seva-results.csv';document.body.appendChild(a);a.click();a.remove();
};

/* organisers (main admin only) */
function renderAdmins(){
  const e=Object.entries(AD).filter(([k,a])=>a&&a.name);
  $('alist').innerHTML=e.length?e.map(([id,a])=>`<div class="row"><div><div class="nm">${esc(a.name)}</div><div class="meta">Added ${a.at?new Date(a.at).toLocaleDateString():''}</div></div><span></span><div class="act"><button data-r="${esc(id)}">Remove</button></div></div>`).join(''):'<div class="note">No other organisers yet.</div>';
}
$('alist').onclick=async e=>{
  const b=e.target.closest('[data-r]');if(!b||S.role!=='main')return;
  if(confirm('Remove this organiser? They will be logged out.')){await del('/admins/'+encodeURIComponent(b.dataset.r));poll()}
};
$('add').onclick=async()=>{
  if(S.role!=='main')return;const n=$('an').value.trim();if(!n){$('an').focus();return}
  $('add').disabled=true;
  try{const pass=newPass(),salt=hex(crypto.getRandomValues(new Uint8Array(8))),id='a'+hex(crypto.getRandomValues(new Uint8Array(5)));
    const h=await kdf(norm(pass),salt);const r=await put('/admins/'+id,{name:n,salt,hash:h,at:Date.now()});if(!r.ok)throw 0;
    $('an').value='';
    $('newpass').innerHTML=`<div class="pc">Passcode for <b style="font-size:16px;letter-spacing:0;display:inline">${esc(n)}</b><b>${pass}</b><div class="note">Send this to them privately. It will not be shown again. If it is lost, remove them and add them again.</div><button class="alt" id="shr">Share</button></div>`;
    $('shr').onclick=()=>{const t='Charana Seva organiser login\nPage: '+location.href.split('?')[0]+'\nPasscode: '+pass;if(navigator.share)navigator.share({text:t}).catch(()=>{});else navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('Copied'))};
    poll();
  }catch(e){alert('Could not add organiser. Check your connection.')}
  $('add').disabled=false;
};
</script></body></html>
